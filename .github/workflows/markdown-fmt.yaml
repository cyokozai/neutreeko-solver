name: Auto format Markdown

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  formatter:
    name: formatter
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
      # markdownfmt has no go.mod, so its dependencies (golang.org/x/term etc.)
      # always resolve to their latest versions. Track the latest stable Go so
      # that those dependencies' minimum Go requirement is always satisfied.
      - name: Set up Go (stable)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - name: Install markdownfmt
        run: |
          go install github.com/shurcooL/markdownfmt@v0.0.0-20231025213440-c8f16ef0855c
      - name: markdownfmt
        run: find . -name '*.md' -type f -not -path "./vendor/*" -exec markdownfmt -w {} +
      - name: Auto Commit
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_message: "chore: auto format markdown files"
          branch: ${{ github.head_ref }}
